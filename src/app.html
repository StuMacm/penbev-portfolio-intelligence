<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PenBev | Portfolio Intelligence</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafbfc; --border:#e3e6ec; --border-2:#d5d9e1;
  --ink:#0f1f3d; --ink-2:#3c4a63; --muted:#6b7588; --faint:#9aa3b2;
  --red:#e41e2b; --red-ink:#b5121d; --red-soft:#fdecee;
  --s1:#2a78d6; --s2:#eb6834; --grid:#eceef2;
  --core:#12855a; --grow:#2a78d6; --fix:#e39a00; --review:#d77bd0; --exit:#b8232b;
  --good:#0c8a3e; --bad:#c62828;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:auto}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--border)}
.brand img{width:190px;display:block;margin-left:-6px}
.brand .prod{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.brand .prod span{color:var(--red)}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--red-soft);color:var(--red-ink)}
.nav a.on svg{stroke:var(--red)}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .title{font-size:15px;font-weight:650;margin-right:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:flex;flex-direction:column;gap:2px}
.f label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
select,input[type=text],input[type=number]{border:1px solid var(--border-2);background:var(--surface);border-radius:6px;padding:5px 8px;height:30px;font-size:12.5px}
select:focus,input:focus{outline:2px solid #cfe0f7;border-color:var(--s1)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:4px 10px;background:var(--surface-2)}
.live i{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px #dcfce7;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px #dcfce7aa}}
.dept{display:flex;border:1px solid var(--border-2);border-radius:7px;overflow:hidden}
.dept button{border:0;background:var(--surface);padding:6px 11px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--border)}
.dept button:last-child{border-right:0}
.dept button.on{background:var(--ink);color:#fff}
.content{flex:1;overflow:auto;padding:20px 22px 40px}
.view{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
h1{font-size:19px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:12.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}.g31{grid-template-columns:3fr 1.15fr}
@media(max-width:1250px){.g3,.g21,.g12,.g31{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:13px;font-weight:650}
.card .cap{color:var(--muted);font-size:11.5px;margin:0 0 10px}
.card-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-h > div:first-child{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(min-width:1500px){.kpis.k8{grid-template-columns:repeat(8,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:500}
.kpi .v{font-size:21px;font-weight:650;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;margin-top:3px;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .ln i{height:2px;width:14px;border-radius:1px}
.legend .clk{cursor:pointer;user-select:none}
.legend .clk.off{opacity:.35}
/* bars */
.hb{display:grid;grid-template-columns:minmax(90px,max-content) 1fr 72px;gap:6px 10px;align-items:center;font-size:12px}
.hb .lb{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:18px;position:relative}
.hb .br{height:100%;border-radius:0 4px 4px 0;min-width:2px;transition:width .3s}
.hb .br.thin{height:8px;margin:1px 0}
.hb .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.hb .row{display:contents}
.hb .row:hover .lb{color:var(--ink)}
/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.3px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--ink-2);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
th.sort{cursor:pointer}
th.sort:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid #f0f1f4;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f9fc}
td.n,th.n{text-align:right}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border-radius:20px;font-size:11.3px;font-weight:600;border:1px solid;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:600;background:#eef1f6;color:var(--ink-2);margin-left:4px}
.tag.new{background:#e6f0fc;color:#1c5cab}
.tag.str{background:#fff1e0;color:#8a4b00}
.tag.ov{background:#f3e8ff;color:#6b21a8}
.tag.na{background:#f1f2f4;color:var(--muted)}
.scorebar{display:inline-block;width:46px;height:6px;border-radius:3px;background:#edf0f4;vertical-align:middle;margin-right:6px;overflow:hidden}
.scorebar b{display:block;height:100%;background:var(--ink)}
.btn{border:1px solid var(--border-2);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:550;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#1c2f55}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 0;color:var(--muted);font-size:12px}
/* tooltip */
#tt{position:fixed;pointer-events:none;z-index:50;background:#0f1f3d;color:#fff;padding:8px 10px;border-radius:7px;font-size:11.5px;line-height:1.45;box-shadow:0 6px 24px rgba(15,31,61,.25);max-width:300px;opacity:0;transition:opacity .08s}
#tt b{font-weight:650}
#tt .m{color:#aab6cc}
#tt .tt-row{display:flex;justify-content:space-between;gap:14px}
svg text{font-family:inherit}
.ax text{fill:var(--muted);font-size:10.5px}
.hov{fill:transparent}
.hov:hover{fill:rgba(15,31,61,.05)}
.bub{cursor:pointer;transition:opacity .15s}
.bub:hover{stroke:#0f1f3d!important;stroke-width:2.5!important}
/* sliders */
input[type=range]{accent-color:var(--ink);width:100%}
.sl{display:grid;grid-template-columns:1fr 64px;gap:4px 10px;align-items:center;margin-bottom:10px}
.sl label{font-size:12px;color:var(--ink-2);grid-column:1/3;display:flex;justify-content:space-between}
.sl label b{font-variant-numeric:tabular-nums}
.sl input[type=number]{height:26px;padding:2px 6px;width:64px}
.note{background:#f6f8fb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-2);line-height:1.5}
.note.warn{background:#fff8eb;border-color:#f6dfb0}
.note.ok{background:#eefaf3;border-color:#bfe6cf}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:12.3px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:550}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs b{color:var(--ink-2);font-weight:550}
.chip{display:inline-flex;border:1px solid var(--border-2);border-radius:5px;font-size:10.5px;padding:1px 5px;margin-right:2px;cursor:pointer;user-select:none;color:var(--ink-2);background:#fff}
.chip.off{background:#f3f4f6;color:var(--faint);text-decoration:line-through}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:fade .2s}
.qlab{font-size:11px;font-weight:700;letter-spacing:.06em}
.empty{color:var(--muted);text-align:center;padding:30px}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:#eef2f8;color:var(--ink);font-weight:600}
.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.grp{border:1px solid var(--border);border-radius:var(--r);background:#fff;padding:10px 12px;cursor:pointer;border-top:3px solid}
.grp.on{box-shadow:0 0 0 2px var(--ink)}
.grp .c{font-size:22px;font-weight:650}
.grp .t{font-size:11.5px;color:var(--muted)}
.inline-sel{height:26px;padding:1px 4px;font-size:11.5px}
.reason{height:26px;font-size:11.5px;width:180px}
.mini{font-size:11px;color:var(--muted)}
.bd-sub td{color:var(--ink-2);font-size:11.5px;padding:4px 10px}
.bd-cat td{font-weight:600;background:#fbfcfd}
.rate{display:inline-flex;gap:3px;align-items:center}
.rate button{min-width:25px;height:25px;border:1px solid var(--border-2);background:#fff;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:0 6px}
.rate button:hover{border-color:var(--ink);color:var(--ink)}
.rate button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rate button.na{margin-left:4px;font-weight:500}
.rate button.na.on{background:#6b7588;border-color:#6b7588}
.tabs{display:flex;border-bottom:1px solid var(--border);gap:2px;margin:4px 0 6px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.tabsc{font-size:10.5px;background:#eef1f6;border-radius:10px;padding:1px 6px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pdot{width:7px;height:7px;border-radius:50%;background:#e39a00;display:inline-block}
.rsel{height:26px;padding:1px 2px;font-size:12px;width:52px;font-weight:600;text-align:center}
.rsel.pend{border-color:#e39a00;background:#fff8eb}
.rsel.v1{background:#fbeaea}.rsel.v2{background:#fdf1e6}.rsel.v3{background:#f6f6f2}.rsel.v4{background:#eaf5ee}.rsel.v5{background:#dcefe3}
.progress{height:6px;border-radius:3px;background:#edf0f4;overflow:hidden}
.progress b{display:block;height:100%;background:var(--core)}
td.dcell{color:var(--muted);background:#fafbfc}
hr.sep{border:0;border-top:1px solid var(--border);margin:12px 0}
</style>
</head>

  if(v>=1e9) return s+'R'+(v/1e9).toFixed(d??2)+'bn';

function buildSkus(){
  return RAW.map(r=>{
    const [code,brand,subBrand,name,pack,category,volK,price,gm,launch,yoy,strategic,incr,role,make,line,cx,chg,batch,eff,invDays,logCx,mix,nd,wd,cust,rp]=r;
    const L=Math.max(0,monthIdx(launch));
    const isNewLaunch=launch!=null;
    const V=volK*1000;
    const vol=[],rev=[],gp=[];
    const g = isNewLaunch ? (launch==='2024-10'?0.35:0.0) : yoy;
    for(let i=0;i<MONTHS;i++){
      if(isNewLaunch && i<L){vol.push(null);rev.push(null);gp.push(null);continue;}
      let base=V/12*SEASON[i%12]*Math.pow(1+g,(i-53.5)/12);
      if(isNewLaunch){ const age=i-L; base*= Math.min(1,0.35+age*0.13); if(launch==='2024-10') base*=1; }
      const noise=1+(rnd()-.5)*0.07;
      const v=base*noise;
      const p=price*Math.pow(1.065,(i-53.5)/12)*(1+(rnd()-.5)*0.01);
      const drift = yoy<-0.03 ? 0.012*(53.5-i)/12 : (yoy>0.06? -0.004*(53.5-i)/12 : 0);
      const m=clamp(gm+drift+(rnd()-.5)*0.012,0.08,0.6);
      vol.push(v);rev.push(v*p);gp.push(v*p*m);
    }
    // region shares
    const tilt=REGION_TILT[rp];
    let rs=REGIONS.map((x,k)=>x.w*tilt[k]*(0.9+rnd()*0.2)); const rt=sum(rs); rs=rs.map(x=>x/rt);
    const cs=mix.map(x=>x/100);
    return {code,brand,subBrand,name,pack,category,priceCase:price,launch,launchIdx:isNewLaunch?L:0,isNewLaunch,strategic,incr,role,make,lineCode:line,line:LINE_LABEL[line],
      cx,chg,batch:batch==null?null:batch*1000,eff,invDays,logCx,chShare:cs,rgShare:rs,numDist:nd/100,wtdDist:wd/100,customers:cust,vol,rev,gp,casesPerPallet:PALLET[pack]||80};
  });
}

const PERIODS={ L12M:{label:'Last 12 months',a:48,b:59}, L3M:{label:'Last 3 months',a:57,b:59}, YTD:{label:'YTD 2026 (Jan–Oct)',a:50,b:59}, FY25:{label:'CY2025 (Jan–Dec)',a:38,b:49}, '5Y':{label:'5 years',a:0,b:59} };

function logCostPerCase(s){ return s.priceCase*(0.045+0.008*s.logCx); }

// Sum a SKU over month range, scaled by channel/region factor
function sumRange(s,key,a,b,f=1){ let t=0,n=0; for(let i=a;i<=b;i++){ const v=s[key][i]; if(v!=null){t+=v;n++;} } return n?t*f:null; }
function filterFactor(s,F){
  let f=1;
  if(F.channel && F.channel!=='All') f*=s.chShare[CHANNELS.indexOf(F.channel)];
  if(F.region && F.region!=='All'){
    if(F.region.startsWith('P:')){ const p=F.region.slice(2); f*=sum(REGIONS.map((r,k)=>r.p===p?s.rgShare[k]:0)); }
    else f*=s.rgShare[REGIONS.findIndex(r=>r.a===F.region)];
  }
  return f;
}
// core metrics for a SKU for a filter context
function skuMetrics(s,F={}){
  const P=PERIODS[F.period||'L12M']; const f=filterFactor(s,F);
  const rev=sumRange(s,'rev',P.a,P.b,f), vol=sumRange(s,'vol',P.a,P.b,f), gp=sumRange(s,'gp',P.a,P.b,f);
  const pa=P.a-12, pb=P.b-12;
  const prevRev= pa>=0? sumRange(s,'rev',pa,pb,f):null, prevVol= pa>=0? sumRange(s,'vol',pa,pb,f):null;
  // growth only if the prior window is fully populated
  const priorFull = pa>=0 && s.rev.slice(pa,pb+1).every(v=>v!=null);
  const revGrowth= priorFull&&prevRev? rev/prevRev-1:null, volGrowth= priorFull&&prevVol? vol/prevVol-1:null;
  const logistics=vol!=null? vol*logCostPerCase(s):null;
  const contribution= gp!=null? gp-logistics-rev*COST.sellingVar:null;
  return {rev,vol,gp,gm:rev?gp/rev:null,contribution,cmPct:rev?contribution/rev:null,revGrowth,volGrowth,logistics};
}
// full-portfolio annual economics (L12M, unfiltered) used for scoring & scenarios
function economics(s){
  const m=skuMetrics(s,{period:'L12M'});
  const months=MONTHS-s.launchIdx;
  const runRateVol= sumRange(s,'vol',57,59)*4, runRateRev=sumRange(s,'rev',57,59)*4;
  const cagr = months>=48 ? Math.pow(sumRange(s,'rev',48,59)/sumRange(s,'rev',12,23),1/3)-1 : null;
  const cogs=m.rev-m.gp;
  const overhead=m.rev*COST.overhead;
  const avoidMfg= s.make==='I' ? m.rev*(0.006+0.0032*s.cx) + (s.chg||0)*52*1150/ (s.batch? Math.max(1, s.batch/40000):1) : m.rev*0.004;
  const avoidLog= m.logistics*0.32;
  const inventory= cogs*s.invDays/365;
  const pallets= (m.vol*s.invDays/365)/s.casesPerPallet;
  const ageMonths= s.isNewLaunch? months : 99;
  const lifecycle= ageMonths<18?'New': (m.volGrowth!=null && m.volGrowth>0.06)?'Growth': (m.volGrowth!=null && m.volGrowth<-0.04)?'Declining':'Mature';
  return {...m,months,runRateVol,runRateRev,cagr,cogs,overhead,avoidMfg,avoidLog,inventory,pallets,palletsPerRm:pallets/(m.rev/1e6),ageMonths,lifecycle,net:m.contribution-overhead,
    velocity:(s.isNewLaunch&&ageMonths<18? runRateVol: m.vol)/(s.wtdDist*100)};
}

function deptScores(code){

    for(const c of d.crit){ const cs=critScore(code,c); if(cs.score!=null){ws+=c.w;t+=c.w*cs.score;avail++;} else if(cs.status==='pending') pending++; else na++; }

function stratOf(code){ const r=getRating(code,'strat'); return r&&typeof r.v==='number'? r.v : BY_CODE[code].strategic; }
let CATSCORE={};
function scorePortfolio(W){
  const rows=SKUS.map(s=>{
    const cs=CATSCORE[s.code]; let ws=0,t=0;
    for(const d of DEPTS){ if(cs[d.k].score!=null){ ws+=W[d.k]; t+=W[d.k]*cs[d.k].score; } }
    const score= ws? t/ws : 0;
    const avail=sum(DEPTS.map(d=>cs[d.k].avail)), total=sum(DEPTS.map(d=>cs[d.k].total)), pending=sum(DEPTS.map(d=>cs[d.k].pending));

  for(const r of rows) r.action=recommend(BY_CODE[r.code],ECO[r.code],r,CATSCORE[r.code]);

}

const ACTIONS={

const ACTION_KEYS=Object.keys(ACTIONS);
function isStrategicException(s,e,score){ return stratOf(s.code)>=4 && score<45; }
function recommend(s,e,r,cs){
  const sc=r.score;
  if(e.lifecycle==='New') return 'grow';
  if(isStrategicException(s,e,sc)) return 'review';
  if(sc>=62) return 'core';
  if((DATA_SC[s.code].rg??0)>=70 && sc>=45) return 'grow';
  if(sc>=47) return 'fix';

}
function quadrantOf(x,y,tx,ty){ return y>=ty ? (x>=tx?'golden':'protect') : (x>=tx?'fix':'review'); }
const QUADS={golden:{t:'GOLDEN QUADRANT',r:'Keep / Grow'},protect:{t:'PROTECT / FIX',r:'Protect; grow volume or distribution'},fix:{t:'FIX',r:'Improve pricing, cost, efficiency or pack economics'},review:{t:'REVIEW / EXIT',r:'Investigate rationalisation, subject to strategy'}};
function explain(code,W){
  const s=BY_CODE[code], e=ECO[code], cs=CATSCORE[code], r=SCORES[code];
  const ranked=DEPTS.filter(c=>cs[c.k].score!=null).map(c=>({c,sc:cs[c.k].score})).sort((a,b)=>b.sc-a.sc);
  const strong=ranked.slice(0,2).filter(x=>x.sc>=55).map(x=>`${x.c.name.toLowerCase()} (${x.sc.toFixed(0)})`);
  const weak=ranked.slice(-2).filter(x=>x.sc<50).map(x=>`${x.c.name.toLowerCase()} (${x.sc.toFixed(0)})`);
  const reasons=[];
  if(strong.length) reasons.push('Strong on '+strong.join(' and '));
  if(weak.length) reasons.push('Weak on '+weak.join(' and '));
  const cons=[];
  if(e.lifecycle==='New') cons.push(`New launch (${e.ageMonths} months) – assessed on run-rate and momentum, not absolute volume`);
  if(isStrategicException(s,e,r.score)) cons.push(`Strategic importance ${stratOf(code)}/5 overrides weak score – management review required`);
  if(s.chShare[4]>0.4) cons.push(`On-premise critical (${fmtP(s.chShare[4],0)} of sales) – check outlet range commitments`);
  if(s.role==='Range-completer') cons.push('Range-completer – removal may weaken mixer offer');
  if(s.make==='P') cons.push('Purchased SKU – manufacturing savings limited to handling');
  if(e.lifecycle==='Declining') cons.push(`Declining volume (${fmtP(e.volGrowth)} YoY)`);
  if(s.lineCode==='L4') cons.push('Returnable glass – removal affects bottle float & deposit liabilities');
  return {reasons,cons};
}

/* =========================================================================
   SCENARIO CALCULATIONS (pure)
   ========================================================================= */
const DEFAULT_ASSUMP={migration:40,mfg:60,log:50,implPerSku:0.35,writeOff:50,packFamily:true};
function newScenario(name='Working scenario'){ return {name,removed:[],restrict:{},a:{...DEFAULT_ASSUMP},target:0}; }
const PACK_FAMILY_SAVING={'300ml Glass RGB':9e6,'6x330ml Can Multipack':4.5e6,'200ml Glass':5e6,'250ml Glass':2.5e6,'440ml Can':3e6,'1L PET':3.5e6,'300ml Can':2e6,'1.5L PET':3e6};
// substitute margin: avg contribution % of retained SKUs in same category, revenue-weighted
function substituteCm(code,removedSet){
  const s=BY_CODE[code];
  let pool=SKUS.filter(x=>x.category===s.category && !removedSet.has(x.code) && x.code!==code);
  if(!pool.length) pool=SKUS.filter(x=>!removedSet.has(x.code));
  if(!pool.length) return 0;
  return sum(pool.map(x=>ECO[x.code].contribution))/sum(pool.map(x=>ECO[x.code].rev));
}
function calcScenario(sc){
  const A=sc.a; const removed=new Set(sc.removed);
  const lines=[]; let revAtRisk=0,migrated=0,lostContr=0,recovered=0,mfg=0,logS=0,impl=0,writeOff=0,wc=0,residual=0;
  const items=[...sc.removed.map(c=>({code:c,frac:1,type:'remove'})),
               ...Object.entries(sc.restrict).filter(([c,ch])=>!removed.has(c)&&ch.length<5).map(([c,ch])=>({code:c,type:'restrict',frac:1-sum(ch.map(k=>BY_CODE[c].chShare[k]))}))];
  for(const it of items){
    const s=BY_CODE[it.code], e=ECO[it.code], f=it.frac;
    const r=e.rev*f, m=r*A.migration/100;
    const lc=e.contribution*f, rc=m*substituteCm(it.code,removed);
    const mf= it.type==='remove'? e.avoidMfg*A.mfg/100 : 0;           // restricted SKUs are still produced
    const ls= e.avoidLog*f*A.log/100*(it.type==='remove'?1:0.5);
    const inv=e.inventory*f;
    const wo= inv*A.writeOff/100;
    const im= (it.type==='remove'? A.implPerSku*1e6 : A.implPerSku*1e6*0.25) + wo;
    revAtRisk+=r; migrated+=m; lostContr+=lc; recovered+=rc; mfg+=mf; logS+=ls; impl+=im; writeOff+=wo; wc+=inv-wo; residual+=e.overhead*f;
    lines.push({...it,rev:r,migrated:m,lostContr:lc,recovered:rc,mfg:mf,log:ls,impl:im,net:-lc+rc+mf+ls});
  }
  // pack-family step change: whole pack format eliminated
  const packsGone=[];
  if(A.packFamily){ for(const p of PACKS){ const all=SKUS.filter(s=>s.pack===p); if(all.length && all.every(s=>removed.has(s.code))) packsGone.push(p);} }
  const packSave=sum(packsGone.map(p=>(PACK_FAMILY_SAVING[p]||2e6)*A.mfg/100));
  const recurring=-lostContr+recovered+mfg+packSave+logS;
  // channel coverage
  const coverage=CHANNELS.map((ch,k)=>{
    const before=SKUS.filter(s=>s.chShare[k]>0.005);
    const after=before.filter(s=>!removed.has(s.code) && !(sc.restrict[s.code] && sc.restrict[s.code].length<5 && !sc.restrict[s.code].includes(k)));
    const revB=sum(before.map(s=>ECO[s.code].rev*s.chShare[k])), revA=sum(after.map(s=>ECO[s.code].rev*s.chShare[k]));
    return {ch,before:before.length,after:after.length,revB,revA,retained:revA/revB};
  });
  return {count:sc.removed.length,restricted:items.length-sc.removed.length,remaining:SKUS.length-sc.removed.length,revAtRisk,migrated,netRevLoss:revAtRisk-migrated,
    lostContr,recovered,mfg,packSave,packsGone,logS,impl,writeOff,wc,residual,recurring,year1:recurring-impl,lines,coverage};
}
// auto-select lowest-scoring, non-protected SKUs to meet a target reduction
function autoSelect(pct){
  const n=Math.round(SKUS.length*pct/100);
  return SKUS.filter(s=>!(ECO[s.code].lifecycle==='New') && !(stratOf(s.code)>=4) && s.role!=='Hero')
    .sort((a,b)=>SCORES[a.code].score-SCORES[b.code].score).slice(0,n).map(s=>s.code);
}

  return [['Conservative',5],['Balanced',15],['Aggressive',30]].map(([n,p])=>{const s=newScenario(`${n} (${p}% SKU reduction)`); s.target=p; s.removed=autoSelect(p); s.preset=true; return s;});
}

  };

  $$('#qLeg .clk').forEach(b=>b.onclick=()=>{QSTATE.hidden[b.dataset.k]=!QSTATE.hidden[b.dataset.k]; b.classList.toggle('off'); draw();});

function substitutes(code){
  const s=BY_CODE[code];
  return SKUS.filter(x=>x.code!==code).map(x=>{ let sim=0; if(x.brand===s.brand) sim+=3; else if(x.category===s.category) sim+=1.5; if(x.pack===s.pack) sim+=2; if(x.subBrand===s.subBrand) sim+=1; const sz=t=>parseFloat(t)*(t.includes('L ')||/\dL/.test(t)?1000:1); if(Math.abs(Math.log(sz(x.pack)/sz(s.pack)))<0.5) sim+=1; return {x,sim}; })
   .filter(o=>o.sim>=2.5).sort((a,b)=>b.sim-a.sim||SCORES[b.x.code].score-SCORES[a.x.code].score).slice(0,5);
}

let DRAFT=null;
function viewScoring(el){
  if(!DRAFT) DRAFT={...STATE.weights};

  const preview=scorePortfolio(DRAFT);
  const rows=SKUS.map(s=>({s,b:BASE_SCORES[s.code],p:preview[s.code]})).sort((a,b)=>a.p.rank-b.p.rank);
  const changed=JSON.stringify(DRAFT)!==JSON.stringify(STATE.weights);

   <h1>Scoring Engine</h1><p class="sub">Configurable weighted model · every sub-metric normalised to 0–100 by portfolio percentile · unavailable metrics are excluded and weights re-based</p>

    <div class="grid" style="align-content:start">
     <div class="card"><div class="card-h"><div><h3>Department weights</h3><p class="cap">How much each department's score counts towards the overall SKU score · must total 100%</p></div><b class="num" style="font-size:18px;color:${total===100?'var(--good)':'var(--bad)'}">${total}%</b></div>
      ${DEPTS.map(c=>`<div class="sl"><label><span>${c.name}</span><span class="mini">default ${DEFAULT_WEIGHTS[c.k]}%</span></label><input type="range" min="0" max="60" step="1" value="${DRAFT[c.k]}" data-k="${c.k}"><input type="number" min="0" max="100" value="${DRAFT[c.k]}" data-k="${c.k}"></div>`).join('')}

      ${changed&&total===100?'<div class="note warn" style="margin-top:10px">Previewing unapplied weights. Apply to update all modules.</div>':''}
     </div>
     <div class="card"><h3>Model rules</h3><div style="font-size:12px;line-height:1.6;color:var(--ink-2)">
      • Each department score blends <b>system data</b> (portfolio percentile, 0–100) with the department's own <b>1–5 ratings</b> (1 → 0, 5 → 100), using the criterion weights below.<br>

       <label class="row" style="font-size:12px;cursor:pointer"><input type="checkbox" id="pf" ${A.packFamily?'checked':''}> Include pack-format step-change savings when a whole pack family is removed</label></div>
     <div class="card"><h3>Bulk select</h3><div class="row" style="margin-bottom:8px"><select id="bPack" style="flex:1"><option value="">Pack format…</option>${PACKS.map(p=>`<option>${p}</option>`).join('')}</select><button class="btn sm" id="bPackGo">Add all</button></div>
       <div class="row"><select id="bFam" style="flex:1"><option value="">Product family…</option>${[...new Set(SKUS.map(s=>s.brand+' · '+s.subBrand))].map(p=>`<option>${p}</option>`).join('')}</select><button class="btn sm" id="bFamGo">Add all</button></div></div>
    </div>
    <div class="grid" style="align-content:start">
     <div class="kpis" style="margin-bottom:0">
      ${[['SKUs removed',`${R.count}${R.restricted?` <span class="mini">+${R.restricted} restricted</span>`:''}`,`${R.remaining} remaining (${fmtP(R.count/SKUS.length,0)} reduction)`],['Revenue at risk',fmtR(R.revAtRisk),fmtP(R.revAtRisk/curRev)+' of portfolio'],['Retained via substitution',fmtR(R.migrated),`Net revenue loss ${fmtR(R.netRevLoss)}`],['Net recurring impact',`<span class="${R.recurring>=0?'up':'down'}">${fmtR(R.recurring)}</span>`,'Contribution p.a., after savings'],
         ['Lost contribution',fmtR(-R.lostContr),'Before migration'],['Savings (mfg + logistics)',fmtR(R.mfg+R.packSave+R.logS),R.packsGone.length?`incl. ${fmtR(R.packSave)} pack-family`:'Avoidable costs only'],['Implementation (one-off)',fmtR(-R.impl),`incl. ${fmtR(R.writeOff)} stock write-off`],['Year-1 net impact',`<span class="${R.year1>=0?'up':'down'}">${fmtR(R.year1)}</span>`,`Working capital release ${fmtR(R.wc)}`]].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('')}

     <div class="grid g21">

      <div class="grid" style="align-content:start">
       <div class="card"><h3>Overhead & working capital</h3><div class="kv" style="margin-top:6px">

      <div class="card"><div class="card-h"><div><h3>Save & compare scenarios</h3><p class="cap">Stored in this browser</p></div></div>

        ${STATE.saved.map((x,i)=>{const r=calcScenario(x); return `<tr><td>${esc(x.name)}${x.preset?'<span class="tag">PRESET</span>':''}</td><td class="n">${r.count}</td><td class="n">${fmtR(r.revAtRisk)}</td><td class="n ${r.recurring>=0?'up':'down'}">${fmtR(r.recurring)}</td><td class="n ${r.year1>=0?'up':'down'}">${fmtR(r.year1)}</td><td class="n"><button class="btn sm" data-load="${i}">Load</button>${x.preset?'':` <button class="btn sm" data-del="${i}">✕</button>`}</td></tr>`;}).join('')}

     <div class="card"><div class="card-h"><div><h3>SKU selection</h3><p class="cap">Tick to remove · toggle channel chips to restrict an SKU to selected channels only · sorted by weighted score (lowest first)</p></div><b class="num">${R.count} selected</b></div>
       <div class="tbl-wrap" style="max-height:420px"><table><thead><tr><th>Remove</th><th>SKU</th><th class="n">Score</th><th>Action</th><th class="n">Revenue</th><th class="n">Contribution</th><th>Keep in channels</th><th class="n">Est. net impact</th></tr></thead><tbody>
       ${skuRows.map(s=>{const e=ECO[s.code], on=removed.has(s.code), rs=sc.restrict[s.code]||[0,1,2,3,4], ln=R.lines.find(l=>l.code===s.code); const prot=e.lifecycle==='New'||s.strategic>=4;
         return `<tr style="${on?'background:#fdf3f3':''}"><td><input type="checkbox" data-rm="${s.code}" ${on?'checked':''}></td><td><a href="#/sku/${s.code}" style="text-decoration:none;font-weight:550">${esc(s.name)}</a>${prot?'<span class="tag str" title="New or strategic – review carefully">PROTECTED</span>':''}<div class="code">${s.code}</div></td><td class="n">${SCORES[s.code].score.toFixed(1)}</td><td>${pillHTML(finalAction(s.code))}</td><td class="n">${fmtR(e.rev)}</td><td class="n">${fmtR(e.contribution)}</td><td>${on?'<span class="mini">Removed</span>':CH_SHORT.map((c,k)=>s.chShare[k]>0.005?`<span class="chip ${rs.includes(k)?'':'off'}" data-rs="${s.code}" data-k="${k}" title="${CHANNELS[k]} ${fmtP(s.chShare[k],0)}">${c}</span>`:'').join('')}</td><td class="n">${ln?`<span class="${ln.net>=0?'up':'down'}">${fmtR(ln.net)}</span>`:'<span class="mini">–</span>'}</td></tr>`;}).join('')}
       </tbody></table></div></div>
    </div>
   </div>`;
  waterfall($('#wf'),[
    {label:'Lost contribution',value:-R.lostContr,note:'Contribution of revenue at risk'},
    {label:'Migration recovery',value:R.recovered,note:`${A.migration}% of revenue migrates at substitutes' contribution margin`},
    {label:'Manufacturing savings',value:R.mfg,note:'Avoidable SKU-level manufacturing cost'},
    {label:'Pack-family step change',value:R.packSave,note:R.packsGone.length?R.packsGone.join(', '):'No full pack family removed'},
    {label:'Logistics savings',value:R.logS},
    {label:'Net recurring impact',value:R.recurring,total:true},
    {label:'Implementation (one-off)',value:-R.impl},
    {label:'Year-1 net impact',value:R.year1,total:true}],290);
  const save=()=>{persist(); viewScenario(el);};
  $$('[data-a]',el).forEach(i=>i.oninput=()=>{ A[i.dataset.a]=+i.value; clearTimeout(i._t); i._t=setTimeout(save,60); });

  $$('.preset',el).forEach(b=>b.onclick=()=>{ const p=+b.dataset.p; sc.target=p; sc.removed=autoSelect(p); sc.restrict={}; sc.name=['Conservative','Balanced','Aggressive'][[5,15,30].indexOf(p)]+' – adjusted'; save(); toast(`${sc.removed.length} SKUs selected`); });

  $('#tgt').onchange=()=>persist();
  $('#autoSel').onclick=()=>{ sc.removed=autoSelect(sc.target); save(); };
  $$('[data-rm]',el).forEach(c=>c.onchange=()=>{ const k=c.dataset.rm; if(c.checked){ if(!sc.removed.includes(k)) sc.removed.push(k);} else sc.removed=sc.removed.filter(x=>x!==k); save(); });
  $$('[data-rs]',el).forEach(c=>c.onclick=()=>{ const code=c.dataset.rs,k=+c.dataset.k; let r=sc.restrict[code]||[0,1,2,3,4]; r=r.includes(k)?r.filter(x=>x!==k):[...r,k]; if(!r.length) return toast('At least one channel must remain – tick Remove instead'); sc.restrict[code]=r; if(r.length===5) delete sc.restrict[code]; save(); });
  const addMany=codes=>{ codes.forEach(c=>{if(!sc.removed.includes(c)) sc.removed.push(c);}); save(); toast(`${codes.length} SKUs added`); };
  $('#bPackGo').onclick=()=>{ const p=$('#bPack').value; if(p) addMany(SKUS.filter(s=>s.pack===p).map(s=>s.code)); };
  $('#bFamGo').onclick=()=>{ const p=$('#bFam').value; if(p) addMany(SKUS.filter(s=>s.brand+' · '+s.subBrand===p).map(s=>s.code)); };
  $('#sSave').onclick=()=>{ const name=$('#sName').value.trim()||'Untitled scenario'; const copy=JSON.parse(JSON.stringify({...sc,name})); delete copy.preset; const i=STATE.saved.findIndex(x=>x.name===name&&!x.preset); if(i>=0) STATE.saved[i]=copy; else STATE.saved.push(copy); sc.name=name; save(); toast('Scenario saved'); };
  $$('[data-load]',el).forEach(b=>b.onclick=()=>{ STATE.scenario=JSON.parse(JSON.stringify(STATE.saved[+b.dataset.load])); delete STATE.scenario.preset; save(); toast('Scenario loaded'); });
  $$('[data-del]',el).forEach(b=>b.onclick=()=>{ STATE.saved.splice(+b.dataset.del,1); save(); });
}

/* =========================================================================
   VIEW 6 — EXECUTIVE RECOMMENDATIONS
   ========================================================================= */
let RGROUP='All';
function viewRecs(el){
  const rows=SKUS.map(s=>{ const e=ECO[s.code]; const single=calcScenario({...newScenario(),removed:[s.code]}); return {s,e,sc:SCORES[s.code],act:finalAction(s.code),sys:SCORES[s.code].action,status:decisionStatus(s.code),ex:explain(s.code),impact:single.recurring}; });
  const proposed=rows.filter(r=>r.act==='exit' && r.status!=='Rejected');
  const R=calcScenario({...newScenario(),removed:proposed.map(r=>r.s.code)});
  const exceptions=rows.filter(r=>isStrategicException(r.s,r.e,r.sc.score)||r.e.lifecycle==='New');
  const overrides=rows.filter(r=>STATE.overrides[r.s.code]?.action);
  const show=rows.filter(r=>RGROUP==='All'||r.act===RGROUP).sort((a,b)=>ACTION_KEYS.indexOf(a.act)-ACTION_KEYS.indexOf(b.act)||b.sc.score-a.sc.score);
  const sCount=st=>rows.filter(r=>r.status===st).length;
  el.innerHTML=`
   <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h1>Executive Recommendations</h1><p class="sub">System recommendations with management overrides and decision status · the score informs, management decides</p></div>
    <div class="row"><button class="btn" id="rCsv">Export CSV</button><button class="btn pri" id="rPrint">Export management summary</button></div></div>
   <div class="grid g4" style="margin-bottom:14px">
     <div class="card"><h3>Current portfolio</h3><div class="kv" style="margin-top:8px"><div>SKUs</div><div>${SKUS.length}</div><div>Revenue</div><div>${fmtR(TOT_REV)}</div><div>Gross profit</div><div>${fmtR(TOT_GP)}</div><div>Avg score</div><div>${avg(rows.map(r=>r.sc.score)).toFixed(1)}</div></div></div>
     <div class="card"><h3>Proposed portfolio</h3><div class="kv" style="margin-top:8px"><div>SKUs</div><div>${R.remaining} <span class="mini">(−${R.count})</span></div><div>Revenue</div><div>${fmtR(TOT_REV-R.netRevLoss)}</div><div>Revenue at risk</div><div>${fmtR(R.revAtRisk)}</div><div>Avg score</div><div>${avg(rows.filter(r=>!proposed.includes(r)).map(r=>r.sc.score)).toFixed(1)}</div></div></div>
     <div class="card"><h3>Estimated financial impact</h3><div class="kv" style="margin-top:8px"><div>Net recurring p.a.</div><div class="${R.recurring>=0?'up':'down'}">${fmtR(R.recurring)}</div><div>Implementation</div><div>${fmtR(-R.impl)}</div><div>Year-1 net</div><div class="${R.year1>=0?'up':'down'}">${fmtR(R.year1)}</div><div>Residual overhead</div><div>${fmtR(R.residual)}</div></div><div class="mini" style="margin-top:6px">Default assumptions: ${DEFAULT_ASSUMP.migration}% migration, ${DEFAULT_ASSUMP.mfg}% mfg, ${DEFAULT_ASSUMP.log}% logistics</div></div>
     <div class="card"><h3>Decision status</h3><div class="kv" style="margin-top:8px">${['Proposed','Under Review','Approved','Rejected'].map(s=>`<div>${s}</div><div>${sCount(s)}</div>`).join('')}<div>Management overrides</div><div>${overrides.length}</div></div></div>
   </div>
   <div class="groups">${ACTION_KEYS.map(k=>{const n=rows.filter(r=>r.act===k); return `<div class="grp ${RGROUP===k?'on':''}" data-g="${k}" style="border-top-color:${ACTIONS[k].hex}"><div class="row" style="justify-content:space-between"><div class="c">${n.length}</div><span style="color:${ACTIONS[k].hex};font-size:16px">${ACTIONS[k].ic}</span></div><div style="font-weight:600">${ACTIONS[k].label}</div><div class="t">${fmtR(sum(n.map(r=>r.e.rev)))} revenue</div></div>`;}).join('')}</div>
   <div class="card" style="margin-bottom:14px;padding:0">
    <div class="row" style="padding:12px 14px 8px;justify-content:space-between"><h3>${RGROUP==='All'?'All SKUs':ACTIONS[RGROUP].label} <span class="mini">(${show.length})</span></h3>${RGROUP!=='All'?'<button class="btn sm" id="gAll">Show all</button>':''}</div>
    <div class="tbl-wrap" style="border:0;border-top:1px solid var(--border);border-radius:0 0 var(--r) var(--r)"><table><thead><tr><th>SKU</th><th class="n">Score</th><th>System</th><th>Management decision</th><th>Override reason</th><th>Status</th><th>Main reasons</th><th>Strategic considerations</th><th class="n">Impact if exited</th><th class="n">Data</th></tr></thead><tbody>
    ${show.map(r=>{const o=STATE.overrides[r.s.code]||{}; return `<tr><td><a href="#/sku/${r.s.code}" style="text-decoration:none;font-weight:550">${esc(r.s.name)}</a><div class="code">${r.s.code}</div></td><td class="n">${scoreHTML(r.sc.score)}</td><td>${pillHTML(r.sys)}</td>
      <td><select class="inline-sel" data-ov="${r.s.code}"><option value="">Accept system</option>${ACTION_KEYS.map(k=>`<option value="${k}" ${o.action===k?'selected':''}>${ACTIONS[k].label}</option>`).join('')}</select></td>
      <td><input type="text" class="reason" data-rs="${r.s.code}" placeholder="${o.action?'Reason required…':'—'}" value="${esc(o.reason||'')}" ${o.action?'':'disabled'} style="${o.action&&!o.reason?'border-color:var(--bad)':''}"></td>
      <td><select class="inline-sel" data-st="${r.s.code}">${['Proposed','Under Review','Approved','Rejected'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td style="white-space:normal;min-width:200px;font-size:11.5px">${r.ex.reasons.join('; ')||'Balanced profile'}</td>
      <td style="white-space:normal;min-width:200px;font-size:11.5px;color:var(--ink-2)">${r.ex.cons.join('; ')||'<span class="mini">None</span>'}</td>
      <td class="n ${r.impact>=0?'up':'down'}">${fmtR(r.impact)}</td><td class="n"><span class="tag ${r.sc.completeness<1?'na':''}" title="Share of metrics available">${fmtP(r.sc.completeness,0)}</span></td></tr>`;}).join('')}
    </tbody></table></div></div>
   <div class="grid g2">
     <div class="card"><h3>Key strategic exceptions</h3><p class="cap">Products where scores alone should not drive the decision</p>${exceptions.map(r=>`<div style="padding:6px 0;border-top:1px solid #f1f2f4"><a href="#/sku/${r.s.code}" style="font-weight:600;text-decoration:none">${esc(r.s.name)}</a> ${r.e.lifecycle==='New'?'<span class="tag new">NEW</span>':'<span class="tag str">STRATEGIC</span>'}<div class="mini">${r.ex.cons[0]||''}</div></div>`).join('')}</div>
     <div class="card"><h3>Outstanding data & assumptions requiring validation</h3><div style="font-size:12px;line-height:1.7;color:var(--ink-2)">
       • Sales migration rate (${DEFAULT_ASSUMP.migration}%) is an assumption – validate with switching / cannibalisation analysis.<br>
       • Avoidable manufacturing cost per SKU to be confirmed with plant finance (changeover cost per minute, set-up waste).<br>
       • ${SKUS.filter(s=>s.make==='P').length} purchased SKUs lack in-house production metrics – co-packer terms and MOQ penalties required.<br>
       • ${SKUS.filter(s=>ECO[s.code].cagr==null).length} SKUs have insufficient history for 3-year CAGR; ${SKUS.filter(s=>ECO[s.code].revGrowth==null).length} lack YoY growth.<br>
       • Customer contractual range commitments (Modern Trade planograms, On-Premise listings) not yet captured.<br>
       • Returnable glass float and deposit liability impact to be quantified before any RGB decision.<br>
       • Strategic importance and incrementality ratings are management assessments – confirm with brand owner.</div></div>
   </div>`;
  $$('.grp',el).forEach(g=>g.onclick=()=>{RGROUP=RGROUP===g.dataset.g?'All':g.dataset.g; viewRecs(el);});
  const ga=$('#gAll'); if(ga) ga.onclick=()=>{RGROUP='All'; viewRecs(el);};
  $$('[data-ov]',el).forEach(s=>s.onchange=()=>{ const c=s.dataset.ov; const o=STATE.overrides[c]||{}; o.action=s.value||undefined; if(!s.value) delete o.reason; STATE.overrides[c]=o; persist(); viewRecs(el); if(s.value) setTimeout(()=>{const i=$(`input[data-rs="${c}"]`); i&&i.focus();},30); });
  $$('input[data-rs]',el).forEach(i=>i.onchange=()=>{ const c=i.dataset.rs; STATE.overrides[c]={...(STATE.overrides[c]||{}),reason:i.value}; persist(); i.style.borderColor=''; toast('Override reason recorded'); });
  $$('[data-st]',el).forEach(s=>s.onchange=()=>{ const c=s.dataset.st; STATE.overrides[c]={...(STATE.overrides[c]||{}),status:s.value}; persist(); viewRecs(el); });
  $('#rCsv').onclick=()=>{ const L=[['SKU','Product','Score','Rank','System action','Management action','Override reason','Status','Main reasons','Strategic considerations','Impact if exited (R)','Data completeness'].join(',')].concat(rows.map(r=>[r.s.code,r.s.name,r.sc.score.toFixed(1),r.sc.rank,ACTIONS[r.sys].label,ACTIONS[r.act].label,STATE.overrides[r.s.code]?.reason||'',r.status,r.ex.reasons.join('; '),r.ex.cons.join('; '),Math.round(r.impact),fmtP(r.sc.completeness,0)].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))); download('penbev_recommendations.csv',L.join('\n'),'text/csv'); };
  $('#rPrint').onclick=()=>printSummary(rows,proposed,R,exceptions);
}
function printSummary(rows,proposed,R,exceptions){
  const w=window.open('','_blank'); if(!w){ toast('Allow pop-ups to export the summary'); return; }
  const logo=document.querySelector('.brand img').src;
  const grp=ACTION_KEYS.map(k=>`<tr><td><span style="color:${ACTIONS[k].hex}">${ACTIONS[k].ic}</span> ${ACTIONS[k].label}</td><td style="text-align:right">${rows.filter(r=>r.act===k).length}</td><td style="text-align:right">${fmtR(sum(rows.filter(r=>r.act===k).map(r=>r.e.rev)))}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html><head><title>PenBev Portfolio Summary</title><style>body{font-family:-apple-system,Segoe UI,Arial,sans-serif;color:#0f1f3d;margin:36px;font-size:12px}h1{font-size:20px;margin:6px 0 2px}h2{font-size:14px;margin:22px 0 6px;border-bottom:2px solid #e41e2b;padding-bottom:4px}table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid #e3e6ec;text-align:left}th{background:#f5f6f8}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k div{border:1px solid #e3e6ec;border-radius:8px;padding:10px}.k b{display:block;font-size:18px;margin-top:4px}.m{color:#6b7588}@media print{body{margin:14mm}}</style></head><body>
   <img src="${logo}" style="width:220px"><h1>SKU Portfolio Optimisation – Management Summary</h1><div class="m">Portfolio Intelligence · Actuals L12M to Oct 2026 · generated ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
   <h2>Portfolio change</h2><div class="k"><div>Current SKUs<b>${SKUS.length}</b></div><div>Proposed SKUs<b>${R.remaining}</b></div><div>Revenue at risk<b>${fmtR(R.revAtRisk)}</b></div><div>Net recurring impact<b>${fmtR(R.recurring)}</b></div><div>Implementation (one-off)<b>${fmtR(-R.impl)}</b></div><div>Year-1 net<b>${fmtR(R.year1)}</b></div><div>Residual overhead<b>${fmtR(R.residual)}</b></div><div>Working capital release<b>${fmtR(R.wc)}</b></div></div>
   <h2>Recommendation mix</h2><table><tr><th>Action</th><th style="text-align:right">SKUs</th><th style="text-align:right">Revenue</th></tr>${grp}</table>
   <h2>Recommended exits</h2><table><tr><th>SKU</th><th>Score</th><th>Status</th><th>Rationale</th><th style="text-align:right">Impact p.a.</th></tr>${proposed.map(r=>`<tr><td><b>${esc(r.s.name)}</b><br><span class="m">${r.s.code}</span></td><td>${r.sc.score.toFixed(1)}</td><td>${r.status}</td><td>${r.ex.reasons.join('; ')}${r.ex.cons.length?'<br><span class="m">'+r.ex.cons.join('; ')+'</span>':''}</td><td style="text-align:right">${fmtR(r.impact)}</td></tr>`).join('')||'<tr><td colspan=5>None</td></tr>'}</table>
   <h2>Strategic exceptions</h2><table>${exceptions.map(r=>`<tr><td><b>${esc(r.s.name)}</b></td><td>${r.ex.cons[0]||''}</td></tr>`).join('')}</table>
   <h2>Management overrides</h2><table>${rows.filter(r=>STATE.overrides[r.s.code]?.action).map(r=>`<tr><td><b>${esc(r.s.name)}</b></td><td>${ACTIONS[r.sys].label} → ${ACTIONS[r.act].label}</td><td>${esc(STATE.overrides[r.s.code].reason||'(no reason recorded)')}</td></tr>`).join('')||'<tr><td>None recorded</td></tr>'}</table>

function route_(){
  const h=(location.hash||'#/dashboard').slice(2); const [r,arg]=h.split('/');
  const route=ROUTES.find(x=>x.h===r)?r:(r==='sku'?'sku':'dashboard');
  renderNav(route==='sku'?'skus':route); renderFilters(route); renderDept();
  $('#pageTitle').textContent=route==='sku'?'SKU Profile':ROUTES.find(x=>x.h===route).t;
  if(route!=='scoring') DRAFT=null;
  const c=$('#content'); const keep=c.dataset.route===h; const st=c.scrollTop;
  c.innerHTML='<div class="view"></div>'; const el=c.firstChild; if(keep) el.style.animation='none';
  ({dashboard:viewDashboard,quadrant:viewQuadrant,skus:viewSkus,ratings:viewRatings,scoring:viewScoring,scenario:viewScenario,recs:viewRecs,sku:e=>viewSku(e,arg)})[route](el);
  if(keep) c.scrollTop=st; else c.scrollTop=0; c.dataset.route=h; TT.style.opacity=0;
}
window.addEventListener('hashchange',route_);
let rt; window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(route_,150);});
route_();

/* =========================================================================
   SELF-TESTS (run in console: PENBEV_TESTS())
   ========================================================================= */
window.PENBEV_TESTS=function(){
  const T=[]; const ok=(n,c)=>T.push({test:n,pass:!!c});
  const s1=scorePortfolio({fin:100,com:0,mfg:0,log:0,sc:0}); ok('Score weighting: 100% Finance = Finance department score', Math.abs(s1['CC-500P'].score-CATSCORE['CC-500P'].fin.score)<1e-9);
  ok('Revenue aggregation: channel split sums to total', Math.abs(sum(CHANNELS.map(c=>skuMetrics(SKUS[0],{channel:c}).rev))-skuMetrics(SKUS[0]).rev)<1);
  ok('Revenue aggregation: region split sums to total', Math.abs(sum(REGIONS.map(r=>skuMetrics(SKUS[3],{region:r.a}).rev))-skuMetrics(SKUS[3]).rev)<1);
  const a=calcScenario({...newScenario(),removed:['FAN-PN-440C'],a:{...DEFAULT_ASSUMP,migration:0}}), b=calcScenario({...newScenario(),removed:['FAN-PN-440C'],a:{...DEFAULT_ASSUMP,migration:50}});
  ok('Migration: 0% migration recovers nothing', a.recovered===0 && a.migrated===0);
  ok('Migration: 50% migration retains half revenue', Math.abs(b.migrated-b.revAtRisk*0.5)<1);
  ok('Financial impact: recurring = -lost + recovered + savings', Math.abs(b.recurring-(-b.lostContr+b.recovered+b.mfg+b.packSave+b.logS))<1);
  ok('Financial impact: overhead excluded from savings', b.residual>0 && b.recurring<b.residual+b.mfg+b.logS);
  ok('Missing data: purchased SKU OEE unavailable (not zero)', DATA_SC['APL-AP-300C'].eff===null && critScore('APL-AP-300C',DEPT.mfg.crit[0]).status==='na');
  ok('Missing data: new SKU growth unavailable', ECO['CNS-440C'].cagr===null && DATA_SC['CNS-440C'].rg===null);
  ok('Pending ratings excluded, not zeroed', CATSCORE['CNS-440C'].sc.score===null && CATSCORE['CNS-440C'].sc.pending===5);
  { const k='CC-300G', L=['load','store','damage','shelf'], saved=JSON.stringify(STATE.ratings), b0=SCORES[k].score; L.forEach(c=>setRating(k,c,5)); recomputeAll(); const up=SCORES[k].score>b0; L.forEach(c=>setRating(k,c,1)); recomputeAll(); const dn=SCORES[k].score<b0; STATE.ratings=JSON.parse(saved); recomputeAll(); ok('Department rating changes flow into overall score', up&&dn&&Math.abs(SCORES[k].score-b0)<1e-9); }
  ok('Department weights total 100 and criteria weights total 100', sum(Object.values(DEFAULT_WEIGHTS))===100 && DEPTS.every(d=>sum(d.crit.map(c=>c.w))===100));
  ok('New product: never recommended for exit', SKUS.filter(s=>ECO[s.code].lifecycle==='New').every(s=>SCORES[s.code].action!=='exit'));
  ok('New product: volume uses run-rate', DATA_RAW['CNS-440C'].cases===ECO['CNS-440C'].runRateVol);
  console.table(T); return T.every(t=>t.pass);
};
